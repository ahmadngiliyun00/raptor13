/* =====================================================================
   PELURU - pool berbasis InstancedMesh dan array bertipe, tanpa alokasi per frame
   ===================================================================== */
const _m4 = new THREE.Matrix4();
const _qa = new THREE.Quaternion();
const _va = new THREE.Vector3();
const _vb = new THREE.Vector3();
const _vc = new THREE.Vector3();
const _one = new THREE.Vector3(1, 1, 1);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

class BulletPool {
  constructor(max, geometry, material) {
    this.max = max;
    this.mesh = new THREE.InstancedMesh(geometry, material, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.count = 0;
    this.mesh.frustumCulled = false;
    this.p = new Float32Array(max * 3);
    this.prev = new Float32Array(max * 3);
    this.v = new Float32Array(max * 3);
    this.q = new Float32Array(max * 4);
    this.life = new Float32Array(max);
    this.dmg = new Float32Array(max);
    this.active = new Uint8Array(max);
    this.alive = 0;
    this.cursor = 0;
    scene.add(this.mesh);
  }
  spawn(x, y, z, dx, dy, dz, speed, life, damage) {
    let i = -1;
    for (let k = 0; k < this.max; k++) {
      const c = (this.cursor + k) % this.max;
      if (!this.active[c]) { i = c; break; }
    }
    if (i < 0) i = this.cursor; else this.alive++;   // pool penuh: timpa slot tertua
    this.cursor = (i + 1) % this.max;
    const i3 = i * 3, i4 = i * 4;
    this.p[i3] = this.prev[i3] = x; this.p[i3 + 1] = this.prev[i3 + 1] = y; this.p[i3 + 2] = this.prev[i3 + 2] = z;
    this.v[i3] = dx * speed; this.v[i3 + 1] = dy * speed; this.v[i3 + 2] = dz * speed;
    _qa.setFromUnitVectors(AXIS_Z, _va.set(dx, dy, dz));
    this.q[i4] = _qa.x; this.q[i4 + 1] = _qa.y; this.q[i4 + 2] = _qa.z; this.q[i4 + 3] = _qa.w;
    this.life[i] = life;
    this.dmg[i] = damage;
    this.active[i] = 1;
    return i;
  }
  kill(i) { if (this.active[i]) { this.active[i] = 0; this.alive--; } }
  update(dt) {
    const p = this.p, prev = this.prev, v = this.v;
    for (let i = 0; i < this.max; i++) {
      if (!this.active[i]) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.kill(i); continue; }
      const i3 = i * 3;
      prev[i3] = p[i3]; prev[i3 + 1] = p[i3 + 1]; prev[i3 + 2] = p[i3 + 2];
      p[i3] += v[i3] * dt; p[i3 + 1] += v[i3 + 1] * dt; p[i3 + 2] += v[i3 + 2] * dt;
    }
  }
  // Salin peluru aktif ke instance 0..n-1 lalu set count = n
  sync() {
    let n = 0;
    for (let i = 0; i < this.max; i++) {
      if (!this.active[i]) continue;
      const i3 = i * 3, i4 = i * 4;
      _va.set(this.p[i3], this.p[i3 + 1], this.p[i3 + 2]);
      _qa.set(this.q[i4], this.q[i4 + 1], this.q[i4 + 2], this.q[i4 + 3]);
      _m4.compose(_va, _qa, _one);
      this.mesh.setMatrixAt(n++, _m4);
    }
    this.mesh.count = n;
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  reset() { this.active.fill(0); this.alive = 0; this.cursor = 0; this.mesh.count = 0; }
}

/* =====================================================================
   SENJATA PEMAIN - cooldown, sayap bergantian, konvergensi ke reticle
   ===================================================================== */
const Weapons = {
  pool: new BulletPool(
    CONFIG.weapons.maxPlayerBullets,
    new THREE.BoxGeometry(0.34, 0.34, 5.5),
    new THREE.MeshBasicMaterial({ color: 0xb4f8ff })
  ),
  cooldown: 0,
  side: 0,
  shotsFired: 0,
  reset() { this.cooldown = 0; this.side = 0; this.shotsFired = 0; this.pool.reset(); },
  update(dt, firing) {
    const W = CONFIG.weapons;
    this.cooldown -= dt;
    if (firing && Player.alive && this.cooldown <= 0) {
      this.cooldown = Math.max(this.cooldown, -W.fireInterval) + W.fireInterval;
      const gun = PlayerModel.guns[this.side];
      this.side ^= 1;
      _va.copy(gun).applyQuaternion(PlayerModel.root.quaternion).add(Player.pos);           // posisi laras
      _vb.copy(Player.pos).addScaledVector(Player.forward, W.convergeDistance).sub(_va).normalize(); // arah ke titik temu
      this.pool.spawn(_va.x, _va.y, _va.z, _vb.x, _vb.y, _vb.z, W.bulletSpeed + Player.speed, W.bulletLife, W.damage);
      this.shotsFired++;
      Events.emit('shot', _va, _vb);
    }
    if (!firing && this.cooldown < 0) this.cooldown = 0;
    this.pool.update(dt);
  },
};

/* =====================================================================
   MUSUH - model, pool, AI sederhana, gelombang dan tembakan musuh
   ===================================================================== */
function buildDroneModel() {
  const g = new THREE.Group();
  const matHull = new THREE.MeshPhongMaterial({ color: 0x3d434c, specular: 0x222222, shininess: 25, flatShading: true });
  const matAccent = new THREE.MeshPhongMaterial({ color: 0xc0462c, emissive: 0x3a0d04, shininess: 20, flatShading: true });
  const matEye = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
  const add = (geo, mat, x, y, z, shadow = true) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = shadow; g.add(m); return m;
  };
  add(new THREE.IcosahedronGeometry(1.25, 0), matHull, 0, 0, 0);
  add(new THREE.OctahedronGeometry(0.55, 0), matEye, 0, 0, -1.05, false);
  const ring = add(new THREE.TorusGeometry(1.95, 0.17, 4, 12), matAccent, 0, 0, 0.1);
  ring.name = 'ring';
  const spike = new THREE.ConeGeometry(0.28, 1.2, 4);
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * Math.PI * 2 + Math.PI / 4;
    const m = add(spike, matHull, Math.cos(a) * 1.45, Math.sin(a) * 1.45, 0.2);
    m.rotation.z = a - Math.PI / 2;
  }
  return g;
}

function buildGunshipModel() {
  const g = new THREE.Group();
  const matRed = new THREE.MeshPhongMaterial({ color: 0x8c3330, specular: 0x331111, shininess: 22, flatShading: true });
  const matDark = new THREE.MeshPhongMaterial({ color: 0x3a3d44, specular: 0x181818, shininess: 18, flatShading: true });
  const matCanopy = new THREE.MeshPhongMaterial({ color: 0xffa64a, emissive: 0x4a2000, shininess: 80, flatShading: true });
  const matGlow = new THREE.MeshBasicMaterial({ color: 0xff5a2a });
  const add = (geo, mat, x = 0, y = 0, z = 0, shadow = true) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = shadow; g.add(m); return m;
  };
  add(loftGeometry([
    { z: -3.9, w: 0.03, ht: 0.03, hb: 0.03 },
    { z: -2.4, w: 0.45, ht: 0.36, hb: 0.26 },
    { z: 0.0, w: 0.72, ht: 0.5, hb: 0.36 },
    { z: 2.6, w: 0.62, ht: 0.4, hb: 0.32 },
    { z: 3.1, w: 0.52, ht: 0.32, hb: 0.28 },
  ]), matDark);
  const wing = [[0.5, -1.0], [3.7, 2.3], [3.7, 2.8], [0.5, 2.95]];
  add(slabGeometry(wing, 0.14), matRed, 0, -0.05, 0);
  add(slabGeometry(mirrorPoly(wing), 0.14), matRed, 0, -0.05, 0);
  const canard = [[0.4, -2.5], [1.5, -1.8], [1.5, -1.45], [0.4, -1.45]];
  add(slabGeometry(canard, 0.08), matRed, 0, 0.05, 0);
  add(slabGeometry(mirrorPoly(canard), 0.08), matRed, 0, 0.05, 0);
  const fin = slabGeometry([[0, 0.7], [1.9, 2.4], [1.9, 2.9], [0, 3.05]], 0.1);
  fin.rotateZ(Math.PI / 2);
  add(fin, matRed, 0, 0.35, 0);
  const canopy = new THREE.SphereGeometry(0.4, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2);
  canopy.scale(0.9, 0.9, 2.4);
  add(canopy, matCanopy, 0, 0.3, -1.6);
  add(new THREE.BoxGeometry(0.62, 0.42, 0.06), matGlow, 0, -0.02, 3.13, false);
  return g;
}

class Enemy {
  constructor(type, template) {
    this.type = type;
    this.cfg = CONFIG.enemies[type];
    this.group = template.clone();      // clone berbagi geometry dan material dengan template
    this.group.visible = false;
    this.ring = this.group.getObjectByName('ring') || null;
    this.pos = this.group.position;
    this.dir = new THREE.Vector3(0, 0, -1);
    this.vel = new THREE.Vector3();
    this.active = false;
    this.hp = 0;
    this.state = 'attack';
    this.timer = 0;
    this.fireCd = 0;
    this.burstLeft = 0;
    this.hitFlash = 0;
    this.bank = 0;
    this.radius = this.cfg.radius;
    scene.add(this.group);
  }
}

const _toP = new THREE.Vector3();
const _desired = new THREE.Vector3();
const _prevDir = new THREE.Vector3();

const Enemies = {
  list: [],
  alive: 0,
  bullets: null,

  init() {
    const droneT = buildDroneModel(), gunT = buildGunshipModel();
    for (let i = 0; i < CONFIG.enemies.maxDrones; i++) this.list.push(new Enemy('drone', droneT));
    for (let i = 0; i < CONFIG.enemies.maxGunships; i++) this.list.push(new Enemy('gunship', gunT));
    this.bullets = new BulletPool(
      CONFIG.enemies.maxBullets,
      new THREE.BoxGeometry(0.5, 0.5, 3.0),
      new THREE.MeshBasicMaterial({ color: 0xff6a3a })
    );
  },

  reset() {
    for (const e of this.list) { e.active = false; e.group.visible = false; }
    this.alive = 0;
    this.bullets.reset();
  },

  spawn(type, x, y, z) {
    const e = this.list.find((en) => !en.active && en.type === type);
    if (!e) return null;
    e.active = true;
    e.group.visible = true;
    e.hp = e.cfg.hp;
    e.pos.set(x, y, z);
    e.dir.set(Player.pos.x - x, 0, Player.pos.z - z).normalize();
    e.vel.copy(e.dir).multiplyScalar(e.cfg.speed);
    e.state = 'attack';
    e.timer = 0;
    e.fireCd = randRange(0.8, 1.6);
    e.burstLeft = 0;
    e.hitFlash = 0;
    e.bank = 0;
    e.group.scale.setScalar(1);
    this.alive++;
    return e;
  },

  // Muncul di depan pemain dalam kerucut arah terbang
  spawnAhead(type, dist, lateralAngle) {
    const D = CONFIG.enemies.spawnDistance;
    const ang = Player.yaw + (lateralAngle !== undefined ? lateralAngle : randRange(-0.9, 0.9));
    const d = dist !== undefined ? dist : randRange(D[0], D[1]);
    const x = Player.pos.x - Math.sin(ang) * d, z = Player.pos.z - Math.cos(ang) * d;
    const y = clamp(Player.pos.y + randRange(-20, 35), groundHeightAt(x, z) + 30, CONFIG.player.maxAltitude - 15);
    return this.spawn(type, x, y, z);
  },

  remove(e) {
    if (!e.active) return;
    e.active = false;
    e.group.visible = false;
    this.alive--;
  },

  // Musuh hancur: byPlayer true berarti ditembak pemain (dapat skor)
  destroy(e, byPlayer) {
    if (!e.active) return;
    this.remove(e);
    Events.emit('enemyDestroyed', e, byPlayer);
  },

  damage(e, amount, x, y, z) {
    e.hp -= amount;
    e.hitFlash = 0.12;
    Events.emit('enemyHit', x, y, z);
    if (e.hp <= 0) this.destroy(e, true);
  },

  update(dt) {
    const diff = Waves.difficulty;
    const P = Player.pos;
    for (const e of this.list) {
      if (!e.active) continue;
      _toP.subVectors(P, e.pos);
      const dist = _toP.length();
      if (dist > CONFIG.enemies.despawnDistance) { this.remove(e); continue; }
      if (e.type === 'drone') this.updateDrone(e, dt, dist, diff);
      else this.updateGunship(e, dt, dist, diff);

      // Jaga di atas terrain
      const ground = groundHeightAt(e.pos.x, e.pos.z) + (e.type === 'drone' ? 8 : 18);
      if (e.pos.y < ground) e.pos.y = damp(e.pos.y, ground, 6, dt) + 0.2;
      if (e.pos.y > CONFIG.player.maxAltitude + 20) e.pos.y = CONFIG.player.maxAltitude + 20;

      // Efek kena: berdenyut sebentar
      if (e.hitFlash > 0) {
        e.hitFlash -= dt;
        e.group.scale.setScalar(1 + Math.max(e.hitFlash, 0) * 2.2);
      }
    }
    this.bullets.update(dt);
  },

  // Drone: mengejar pelan, menghadap pemain, cincin berputar
  updateDrone(e, dt, dist, diff) {
    const c = e.cfg;
    // Pelan saat dekat, tetapi menyusul bila tertinggal jauh agar tetap relevan
    const catchUp = 1 + clamp((dist - 250) / 250, 0, 1.3);
    _desired.copy(_toP).multiplyScalar(1 / Math.max(dist, 0.001)).multiplyScalar(c.speed * Math.min(diff, 1.5) * catchUp);
    e.vel.x = damp(e.vel.x, _desired.x, c.agility, dt);
    e.vel.y = damp(e.vel.y, _desired.y, c.agility, dt);
    e.vel.z = damp(e.vel.z, _desired.z, c.agility, dt);
    e.pos.addScaledVector(e.vel, dt);
    e.group.lookAt(e.pos.x * 2 - Player.pos.x, e.pos.y * 2 - Player.pos.y, e.pos.z * 2 - Player.pos.z);
    if (e.ring) e.ring.rotation.z += dt * 3.5;
  },

  // Pesawat penembak: serang dan tembak, lalu melintas menjauh, lalu berbalik lagi
  updateGunship(e, dt, dist, diff) {
    const c = e.cfg;
    _prevDir.copy(e.dir);
    if (e.state === 'attack') {
      // Arahkan ke posisi pemain sedikit di depan (lead)
      _desired.copy(Player.vel).multiplyScalar(0.6).add(Player.pos).sub(e.pos).normalize();
      if (dist < 45) { e.state = 'extend'; e.timer = c.extendTime; }
    } else {
      _desired.copy(e.dir);
      _desired.y = Math.max(_desired.y, 0.08);
      e.timer -= dt;
      if (e.timer <= 0) e.state = 'attack';
    }
    // Hindari terrain di depan
    const ahead = groundHeightAt(e.pos.x + e.dir.x * 70, e.pos.z + e.dir.z * 70);
    if (e.pos.y < ahead + 35) _desired.y = Math.max(_desired.y, 0.45);
    _desired.normalize();
    e.dir.lerp(_desired, clamp(c.turnRate * dt * 1.6, 0, 1)).normalize();
    const speed = c.speed * Math.sqrt(diff);
    e.pos.addScaledVector(e.dir, speed * dt);

    // Miring saat belok
    const turn = (_prevDir.z * e.dir.x - _prevDir.x * e.dir.z) / Math.max(dt, 1e-4);
    e.bank = damp(e.bank, clamp(-turn * 1.4, -1.0, 1.0), 4, dt);
    e.group.lookAt(e.pos.x - e.dir.x, e.pos.y - e.dir.y, e.pos.z - e.dir.z);
    e.group.rotateZ(e.bank);

    // Menembak saat pemain ada di kerucut depan dan dalam jangkauan, dalam semburan pendek
    e.fireCd -= dt;
    if (e.state === 'attack' && dist < c.fireRange && Player.alive && e.fireCd <= 0) {
      const facing = (e.dir.x * _toP.x + e.dir.y * _toP.y + e.dir.z * _toP.z) / Math.max(dist, 0.001);
      if (facing > Math.cos(c.fireCone)) {
        const t = dist / c.bulletSpeed;
        _va.copy(Player.vel).multiplyScalar(t * 0.8).add(Player.pos);
        _va.x += randRange(-2, 2); _va.y += randRange(-2, 2); _va.z += randRange(-2, 2);
        _vb.copy(e.pos).addScaledVector(e.dir, 4);
        _va.sub(_vb).normalize();
        this.bullets.spawn(_vb.x, _vb.y, _vb.z, _va.x, _va.y, _va.z, c.bulletSpeed, CONFIG.enemies.bulletLife,
          c.bulletDamage * (1 + (diff - 1) * 0.5));
        Events.emit('enemyShot', _vb);
        if (e.burstLeft <= 0) e.burstLeft = c.burst;
        e.burstLeft--;
        e.fireCd = e.burstLeft > 0 ? 0.16 : c.fireInterval / diff;
      }
    }
  },
};
Enemies.init();

/* =====================================================================
   GELOMBANG - jumlah musuh dan kesulitan naik tiap gelombang
   ===================================================================== */
const Waves = {
  wave: 0, phase: 'break', timer: 0, waveTime: 0, spawnTimer: 0,
  remDrones: 0, remGunships: 0, difficulty: 1,

  reset() {
    this.wave = 0; this.phase = 'break'; this.timer = CONFIG.waves.firstDelay;
    this.waveTime = 0; this.spawnTimer = 0; this.remDrones = 0; this.remGunships = 0; this.difficulty = 1;
  },

  start(n) {
    const W = CONFIG.waves;
    this.wave = n;
    this.phase = 'active';
    this.remDrones = Math.min(3 + 2 * (n - 1), 14);
    this.remGunships = Math.min(1 + Math.floor((n - 1) / 2), 7);
    this.spawnTimer = 0.4;
    this.waveTime = 0;
    this.difficulty = Math.min(1 + W.difficultyStep * (n - 1), W.maxDifficulty);
    Events.emit('waveStart', n);
  },

  update(dt) {
    if (!Debug.enemiesEnabled) return;
    const W = CONFIG.waves;
    if (this.phase === 'break') {
      this.timer -= dt;
      if (this.timer <= 0) this.start(this.wave + 1);
      return;
    }
    this.waveTime += dt;
    this.spawnTimer -= dt;
    const rem = this.remDrones + this.remGunships;
    if (rem > 0 && this.spawnTimer <= 0) {
      const pickGun = this.remGunships > 0 && (this.remDrones === 0 || rand() < this.remGunships / rem);
      const e = Enemies.spawnAhead(pickGun ? 'gunship' : 'drone');
      if (e) { if (pickGun) this.remGunships--; else this.remDrones--; }
      this.spawnTimer = W.spawnInterval / Math.sqrt(this.difficulty);
    }
    if ((rem === 0 && Enemies.alive === 0) || this.waveTime > W.maxDuration) {
      this.phase = 'break';
      this.timer = W.breakTime;
      Events.emit('waveCleared', this.wave);
    }
  },
};

/* =====================================================================
   TABRAKAN DAN DAMAGE - jarak kuadrat dan uji segmen ke bola
   ===================================================================== */
function updateCombat() {
  const pb = Weapons.pool, eb = Enemies.bullets, list = Enemies.list, pad = CONFIG.weapons.hitPadding;

  // Peluru pemain terhadap musuh dan terrain
  for (let i = 0; i < pb.max; i++) {
    if (!pb.active[i]) continue;
    const i3 = i * 3;
    const ax = pb.prev[i3], ay = pb.prev[i3 + 1], az = pb.prev[i3 + 2];
    const bx = pb.p[i3], by = pb.p[i3 + 1], bz = pb.p[i3 + 2];
    let hit = false;
    for (let k = 0; k < list.length; k++) {
      const e = list[k];
      if (!e.active) continue;
      const r = e.radius + pad;
      const ex = e.pos.x - bx, ey = e.pos.y - by, ez = e.pos.z - bz;
      if (ex * ex + ey * ey + ez * ez > (r + 40) * (r + 40)) continue;   // tolak cepat
      if (segmentHitsSphere(ax, ay, az, bx, by, bz, e.pos.x, e.pos.y, e.pos.z, r)) {
        pb.kill(i);
        Enemies.damage(e, pb.dmg[i], bx, by, bz);
        hit = true;
        break;
      }
    }
    if (!hit && (by < groundHeightAt(bx, bz) || Obstacles.collide(bx, by, bz, 0) >= 0)) {
      pb.kill(i);
      Events.emit('bulletImpact', bx, by, bz);
    }
  }

  // Peluru musuh terhadap pemain dan terrain
  const P = Player.pos, pr = CONFIG.player.radius;
  for (let i = 0; i < eb.max; i++) {
    if (!eb.active[i]) continue;
    const i3 = i * 3;
    const bx = eb.p[i3], by = eb.p[i3 + 1], bz = eb.p[i3 + 2];
    if (Player.alive && segmentHitsSphere(eb.prev[i3], eb.prev[i3 + 1], eb.prev[i3 + 2], bx, by, bz, P.x, P.y, P.z, pr)) {
      eb.kill(i);
      Events.emit('bulletImpact', bx, by, bz);
      Player.damage(eb.dmg[i], 'peluru');
      continue;
    }
    if (by < groundHeightAt(bx, bz)) eb.kill(i);
  }

  // Tabrakan badan musuh dengan pemain
  if (!Player.alive) return;
  for (let k = 0; k < list.length; k++) {
    const e = list[k];
    if (!e.active) continue;
    const r = e.radius + pr;
    if (e.pos.distanceToSquared(P) < r * r) {
      Enemies.destroy(e, false);
      Player.damage(e.cfg.contactDamage, 'tabrakan');
    }
  }
}

// Skor saat musuh hancur oleh tembakan pemain
Events.on('enemyDestroyed', (e, byPlayer) => {
  if (!byPlayer) return;
  Game.kills++;
  Combo.registerKill();
  addScore(Math.round(e.cfg.score * Combo.multiplier), e.type === 'drone' ? 'DRONE' : 'PENEMBAK');
});
function addScore(amount, label) {
  Game.score += amount;
  if (label) Events.emit('score', amount, label);
}

/* =====================================================================
   RINTANGAN - pilar batu per potong terrain (InstancedMesh, ikut di-recycle)
   ===================================================================== */
const Obstacles = {
  maxPer: CONFIG.obstacles.pillarsPerChunk,
  data: null,        // per pilar: x, z, base, height, radius (radius 0 berarti tidak aktif)
  mesh: null,
  _pos: new THREE.Vector3(), _scale: new THREE.Vector3(), _quat: new THREE.Quaternion(), _color: new THREE.Color(),
  _rocks: [new THREE.Color(0x8a7f72), new THREE.Color(0x7a7064), new THREE.Color(0x968b7c)],

  init() {
    const count = World.slots.length * this.maxPer;
    const geo = new THREE.CylinderGeometry(0.55, 1, 1, 6, 1);
    geo.translate(0, 0.5, 0);
    this.mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), count);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.receiveShadow = Q.shadows;
    this.data = new Float32Array(count * 5);
    _m4.makeScale(0, 0, 0);
    for (let i = 0; i < count; i++) { this.mesh.setMatrixAt(i, _m4); this.mesh.setColorAt(i, this._rocks[0]); }
    scene.add(this.mesh);
    World.onChunkRebuilt = (slot) => this.placeForChunk(slot);
  },

  placeForChunk(slot) {
    const O = CONFIG.obstacles, C = World.C, cx = slot.cx, cz = slot.cz;
    for (let k = 0; k < this.maxPer; k++) {
      const idx = slot.index * this.maxPer + k, d = idx * 5;
      this.data[d + 4] = 0;
      _m4.makeScale(0, 0, 0);
      if (hash3(cx, cz, 10 + k) < O.pillarChance) {
        const x = cx * C + (0.15 + 0.7 * hash3(cx, cz, 20 + k)) * C;
        const z = cz * C + (0.15 + 0.7 * hash3(cx, cz, 30 + k)) * C;
        const ground = World.heightAt(x, z);
        if (ground > 4 && ground < 95) {
          const base = ground - 4, height = 45 + 70 * hash3(cx, cz, 40 + k), radius = 6 + 5 * hash3(cx, cz, 50 + k);
          this.data[d] = x; this.data[d + 1] = z; this.data[d + 2] = base; this.data[d + 3] = height; this.data[d + 4] = radius;
          this._quat.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, hash3(cx, cz, 60 + k) * Math.PI);
          _m4.compose(this._pos.set(x, base, z), this._quat, this._scale.set(radius, height, radius));
          this.mesh.setColorAt(idx, this._rocks[Math.floor(hash3(cx, cz, 70 + k) * 3)]);
        }
      }
      this.mesh.setMatrixAt(idx, _m4);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  },

  // Mengembalikan indeks data pilar yang ditabrak bola (x, y, z, r), atau -1
  collide(x, y, z, r) {
    const D = this.data;
    for (let d = 0; d < D.length; d += 5) {
      const radius = D[d + 4];
      if (radius === 0) continue;
      const dx = x - D[d], dz = z - D[d + 1];
      const t = clamp((y - D[d + 2]) / D[d + 3], 0, 1);
      const rr = radius * (1 - 0.45 * t) + r;
      if (dx * dx + dz * dz < rr * rr && y < D[d + 2] + D[d + 3] + r) return d;
    }
    return -1;
  },
};
Obstacles.init();

// Tabrakan pemain dengan terrain dan pilar, serta peringatan medan di depan
function updateTerrainCollision(dt) {
  const O = CONFIG.obstacles, P = Player.pos, pr = CONFIG.player.radius;
  Player.invuln = Math.max(0, Player.invuln - dt);

  const ground = World.heightAt(P.x, P.z);
  let crashed = false;
  if (P.y - pr * 0.6 < ground) {
    P.y = ground + pr * 0.6 + 4;
    crashed = true;
    if (Player.invuln <= 0) Player.damage(O.terrainDamage, 'terrain');
  } else {
    const d = Obstacles.collide(P.x, P.y, P.z, pr * 0.8);
    if (d >= 0) {
      // Dorong keluar dari pilar secara horizontal
      const D = Obstacles.data, dx = P.x - D[d], dz = P.z - D[d + 1];
      const len = Math.hypot(dx, dz) || 1;
      const push = D[d + 4] + pr + 3;
      P.x = D[d] + (dx / len) * push;
      P.z = D[d + 1] + (dz / len) * push;
      crashed = true;
      if (Player.invuln <= 0) Player.damage(O.pillarDamage, 'pilar');
    }
  }
  if (crashed) {
    if (Player.invuln <= 0) Player.invuln = O.invulnTime;
    Player.pitch = Math.max(Player.pitch, 0.45);   // memantul dengan hidung naik
    Events.emit('crash', P);
  }

  // Prediksi jalur di depan untuk peringatan "TARIK NAIK"
  let warn = false;
  for (let k = 1; k <= 3 && !warn; k++) {
    const dist = (O.warnAhead / 3) * k;
    const x = P.x + Player.forward.x * dist, y = P.y + Player.forward.y * dist, z = P.z + Player.forward.z * dist;
    if (y - World.heightAt(x, z) < 6) warn = true;
  }
  Player.warning = warn || (P.y - ground < 12 && ground > CONFIG.world.waterLevel + 1);
}

/* =====================================================================
   CINCIN - gerbang di udara, berantai di depan pemain
   ===================================================================== */
const Rings = {
  items: [],
  lastPos: new THREE.Vector3(),
  lastYaw: 0,
  hasLast: false,
  passed: 0,

  init() {
    const R = CONFIG.rings;
    const torus = new THREE.TorusGeometry(R.radius, 0.9, 6, 24);
    const disc = new THREE.CircleGeometry(R.radius - 0.6, 24);
    const matRing = new THREE.MeshLambertMaterial({ color: 0xffc23a, emissive: 0x8a5200, flatShading: true });
    const matDisc = new THREE.MeshBasicMaterial({
      color: 0xffc860, transparent: true, opacity: 0.14,
      side: THREE.DoubleSide, depthWrite: false,
    });
    for (let i = 0; i < R.maxActive + 1; i++) {
      const g = new THREE.Group();
      const ring = new THREE.Mesh(torus, matRing);
      ring.castShadow = true;
      g.add(ring, new THREE.Mesh(disc, matDisc));
      g.visible = false;
      scene.add(g);
      this.items.push({ group: g, active: false, normal: new THREE.Vector3(), prevSide: 0 });
    }
  },

  reset() {
    for (const it of this.items) { it.active = false; it.group.visible = false; }
    this.hasLast = false;
    this.passed = 0;
  },

  activeCount() { let n = 0; for (const it of this.items) if (it.active) n++; return n; },

  place(x, y, z, yaw) {
    const it = this.items.find((r) => !r.active);
    if (!it) return null;
    it.active = true;
    it.group.visible = true;
    it.group.position.set(x, y, z);
    it.normal.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    it.group.lookAt(x + it.normal.x, y, z + it.normal.z);
    it.prevSide = (Player.pos.x - x) * it.normal.x + (Player.pos.z - z) * it.normal.z;
    this.lastPos.set(x, y, z);
    this.lastYaw = yaw;
    this.hasLast = true;
    return it;
  },

  // Cincin berikutnya ditempatkan relatif terhadap cincin terakhir (atau pemain bila rantai putus)
  spawnNext() {
    const R = CONFIG.rings;
    let ax, ay, az, yaw;
    if (this.hasLast && this.activeCount() > 0) {
      ax = this.lastPos.x; ay = this.lastPos.y; az = this.lastPos.z; yaw = this.lastYaw + randRange(-0.45, 0.45);
    } else {
      ax = Player.pos.x; ay = Player.pos.y; az = Player.pos.z; yaw = Player.yaw + randRange(-0.3, 0.3);
    }
    const d = randRange(R.spacing[0], R.spacing[1]);
    const x = ax - Math.sin(yaw) * d, z = az - Math.cos(yaw) * d;
    let ground = groundHeightAt(x, z);
    ground = Math.max(ground, groundHeightAt(x + 15, z), groundHeightAt(x - 15, z), groundHeightAt(x, z + 15), groundHeightAt(x, z - 15));
    const y = clamp(ay + randRange(-25, 25), ground + R.radius + 18, CONFIG.player.maxAltitude - 25);
    this.place(x, y, z, yaw);
  },

  update(dt) {
    const R = CONFIG.rings, P = Player.pos;
    if (this.activeCount() < R.maxActive) this.spawnNext();
    for (const it of this.items) {
      if (!it.active) continue;
      const g = it.group;
      g.children[0].rotation.z += dt * 0.6;
      const rx = P.x - g.position.x, ry = P.y - g.position.y, rz = P.z - g.position.z;
      const side = rx * it.normal.x + rz * it.normal.z;
      if (it.prevSide <= 0 && side > 0) {
        // Melintasi bidang cincin: lulus bila jarak lateral di dalam radius
        const lat2 = rx * rx + ry * ry + rz * rz - side * side;
        if (lat2 < (R.radius - 0.8) * (R.radius - 0.8)) {
          it.active = false; g.visible = false;
          this.passed++;
          Player.addNitro(R.nitroBonus);
          addScore(Math.round(R.score * Combo.multiplier), 'GERBANG');
          Events.emit('ringPassed', g.position);
          continue;
        }
      }
      it.prevSide = side;
      // Terlewat jauh atau tertinggal: buang
      const ahead = -(rx * Player.forward.x + rz * Player.forward.z);
      if (side > 120 || ahead < -150 || rx * rx + rz * rz > 900 * 900) { it.active = false; g.visible = false; }
    }
  },
};
Rings.init();

/* =====================================================================
   PICKUP - perbaikan (hijau) dan nitro (oranye), muncul sesekali
   ===================================================================== */
const Pickups = {
  items: [],
  timer: 0,
  collected: 0,

  init() {
    const beamGeo = new THREE.CylinderGeometry(0.45, 0.45, 90, 6, 1, true);
    beamGeo.translate(0, -45, 0);
    const shellGeo = new THREE.IcosahedronGeometry(2.4, 0);
    const make = (type, color, emissive) => {
      const g = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color, emissive, flatShading: true });
      const spin = new THREE.Group();
      if (type === 'repair') {
        spin.add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.8, 0.8), mat), new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.6, 0.8), mat));
      } else {
        const can = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 1.9, 8), mat);
        const tip = new THREE.Mesh(new THREE.ConeGeometry(0.75, 0.9, 8), mat);
        tip.position.y = 1.4;
        spin.add(can, tip);
      }
      spin.add(new THREE.Mesh(shellGeo, new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.55 })));
      const beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      g.add(spin, beam);
      g.visible = false;
      scene.add(g);
      return { type, group: g, spin, active: false, baseY: 0, t: 0 };
    };
    for (let i = 0; i < 2; i++) {
      this.items.push(make('repair', 0x46e07a, 0x0d4a1e));
      this.items.push(make('nitro', 0xff9a2a, 0x4a2400));
    }
  },

  reset() {
    for (const it of this.items) { it.active = false; it.group.visible = false; }
    this.timer = randRange(6, 10);
    this.collected = 0;
  },

  place(type, x, y, z) {
    const it = this.items.find((p) => !p.active && p.type === type);
    if (!it) return null;
    it.active = true; it.group.visible = true; it.baseY = y; it.t = 0;
    it.group.position.set(x, y, z);
    return it;
  },

  spawnAhead(type) {
    const ang = Player.yaw + randRange(-0.35, 0.35), d = randRange(300, 420);
    const x = Player.pos.x - Math.sin(ang) * d, z = Player.pos.z - Math.cos(ang) * d;
    const y = clamp(Player.pos.y + randRange(-15, 15), groundHeightAt(x, z) + 15, CONFIG.player.maxAltitude - 20);
    return this.place(type, x, y, z);
  },

  update(dt) {
    const PU = CONFIG.pickups, P = Player.pos;
    this.timer -= dt;
    if (this.timer <= 0) {
      const type = Player.health < 70 && rand() < 0.65 ? 'repair' : (rand() < 0.5 ? 'nitro' : 'repair');
      this.spawnAhead(type);
      this.timer = randRange(PU.interval[0], PU.interval[1]);
    }
    for (const it of this.items) {
      if (!it.active) continue;
      it.t += dt;
      it.spin.rotation.y += dt * 1.8;
      it.group.position.y = it.baseY + Math.sin(it.t * 2.2) * 0.8;
      const d2 = it.group.position.distanceToSquared(P);
      if (Player.alive && d2 < (PU.radius + CONFIG.player.radius) ** 2) {
        it.active = false; it.group.visible = false;
        this.collected++;
        if (it.type === 'repair') Player.heal(PU.repairAmount); else Player.addNitro(PU.nitroAmount);
        addScore(50, it.type === 'repair' ? 'PERBAIKAN' : 'NITRO');
        Events.emit('pickup', it.type, it.group.position);
        continue;
      }
      const ahead = (it.group.position.x - P.x) * Player.forward.x + (it.group.position.z - P.z) * Player.forward.z;
      if (ahead < -150 || d2 > 900 * 900) { it.active = false; it.group.visible = false; }
    }
  },
};
Pickups.init();

/* =====================================================================
   COMBO - kill beruntun dalam jendela waktu singkat menaikkan multiplier
   ===================================================================== */
const Combo = {
  count: 0, timer: 0, best: 0,
  get multiplier() {
    const C = CONFIG.combo;
    return Math.min(C.maxMultiplier, 1 + Math.max(0, this.count - 1) * C.step);
  },
  reset() { this.count = 0; this.timer = 0; this.best = 0; },
  registerKill() {
    this.count = this.timer > 0 ? this.count + 1 : 1;
    this.timer = CONFIG.combo.window;
    this.best = Math.max(this.best, this.count);
  },
  update(dt) {
    if (this.timer > 0) { this.timer -= dt; if (this.timer <= 0) this.count = 0; }
  },
};

/* =====================================================================
   KAMERA CHASE - lag pada rotasi (bukan posisi) agar jarak ke pesawat stabil
   di kecepatan berapa pun, FOV melebar saat nitro, dan getaran berbasis trauma
   ===================================================================== */
const CamRig = {
  yaw: 0, pitch: 0, roll: 0, trauma: 0, t: 0,
  offset: new THREE.Vector3(),
  look: new THREE.Vector3(),
  q: new THREE.Quaternion(),
  e: new THREE.Euler(0, 0, 0, 'YXZ'),

  reset() {
    this.yaw = Player.yaw; this.pitch = 0; this.roll = 0; this.trauma = 0;
    camera.fov = CONFIG.camera.fov;
    camera.updateProjectionMatrix();
  },
  addTrauma(amount) { this.trauma = Math.min(1, this.trauma + amount); },

  update(dt) {
    const C = CONFIG.camera;
    this.t += dt;
    this.yaw = dampAngle(this.yaw, Player.yaw, C.rotLag, dt);
    this.pitch = damp(this.pitch, Player.pitch * C.pitchFollow, C.rotLag, dt);
    this.roll = damp(this.roll, Player.roll * C.rollFollow, C.rotLag, dt);
    const nf = Player.nitroFx;

    this.e.set(this.pitch, this.yaw, 0);
    this.q.setFromEuler(this.e);
    this.offset.set(0, C.height, C.distance + nf * C.nitroPullBack).applyQuaternion(this.q);
    camera.position.copy(Player.pos).add(this.offset);
    const minY = groundHeightAt(camera.position.x, camera.position.z) + 2.5;
    if (camera.position.y < minY) camera.position.y = minY;

    this.look.set(0, C.lookHeight, -C.lookAhead).applyQuaternion(this.q).add(Player.pos);
    camera.lookAt(this.look);
    camera.rotateZ(this.roll);

    // Getar: kombinasi sinus berfrekuensi berbeda, lebih halus dari jitter acak
    this.trauma = Math.max(0, this.trauma - C.shakeDecay * dt);
    const s = this.trauma * this.trauma * C.shakeHit + nf * C.shakeNitro;
    if (s > 1e-4) {
      const t = this.t;
      camera.position.x += (Math.sin(t * 37.1) + 0.5 * Math.sin(t * 23.7)) * s;
      camera.position.y += (Math.sin(t * 41.3) + 0.5 * Math.sin(t * 19.1)) * s;
      camera.rotateZ(Math.sin(t * 29.3) * s * 0.02);
    }

    const targetFov = lerp(C.fov, C.nitroFov, nf);
    if (Math.abs(targetFov - camera.fov) > 0.01) {
      camera.fov = targetFov;
      camera.updateProjectionMatrix();
    }
  },
};
CamRig.reset();

/* =====================================================================
   GAME STATE - menu, play, pause, dying, gameover
   ===================================================================== */
const ui = {
  title: document.getElementById('screen-title'),
  pause: document.getElementById('screen-pause'),
  over: document.getElementById('screen-over'),
  btnStart: document.getElementById('btn-start'),
  btnResume: document.getElementById('btn-resume'),
  btnRestart: document.getElementById('btn-restart'),
};

const Game = {
  state: 'menu',
  time: 0,          // waktu bermain sesi ini (detik)
  stateTime: 0,     // lama berada di state sekarang
  frame: 0,
  muted: false,
  score: 0,
  kills: 0,
  seed: CONFIG.seed,
};

function setState(next) {
  Game.state = next;
  Game.stateTime = 0;
  ui.title.classList.toggle('hidden', next !== 'menu');
  ui.pause.classList.toggle('hidden', next !== 'pause');
  ui.over.classList.toggle('hidden', next !== 'gameover');
  document.getElementById('hud').classList.toggle('hidden', next === 'menu');
}

// Reset seluruh state sesi tanpa membuat ulang objek (semua pool dipakai ulang)
function resetSession() {
  Game.time = 0;
  Game.score = 0;
  Game.kills = 0;
  Game.seed = Debug.fixedSeed !== null ? Debug.fixedSeed
    : CONFIG.randomSeedPerRun ? (Math.random() * 4294967296) >>> 0 : CONFIG.seed;
  rand.reseed(Game.seed);
  World.reset(Game.seed);
  Player.reset();
  Weapons.reset();
  Enemies.reset();
  Waves.reset();
  Rings.reset();
  Pickups.reset();
  Combo.reset();
  CamRig.reset();
}

function startGame() {
  resetSession();
  setState('play');
}

function togglePause() {
  if (Game.state === 'play') setState('pause');
  else if (Game.state === 'pause') setState('play');
}

function restartGame() {
  if (Game.state === 'menu') return;
  startGame();
}

ui.btnStart.addEventListener('click', () => { ui.btnStart.blur(); onAudioGesture(); startGame(); });
ui.btnResume.addEventListener('click', () => { ui.btnResume.blur(); togglePause(); });
ui.btnRestart.addEventListener('click', () => { ui.btnRestart.blur(); restartGame(); });

/* =====================================================================
   HUD - elemen DOM, ditulis hanya saat nilainya berubah
   ===================================================================== */
const hud = {
  root: document.getElementById('hud'),
  reticle: document.getElementById('reticle'),
  nitroBar: document.getElementById('nitro-bar'),
  nitroFill: document.getElementById('nitro-fill'),
  last: Object.create(null),
};
// Tulis ke DOM hanya bila berubah, agar tidak memicu layout setiap frame
function hudSet(key, value, apply) {
  if (hud.last[key] === value) return;
  hud.last[key] = value;
  apply(value);
}
function updateHud() {
  hudSet('nitro', Math.round(Player.nitro * 200) / 200, (v) => { hud.nitroFill.style.transform = `scaleX(${v})`; });
  hudSet('nitroLock', Player.nitroLock > 0, (v) => hud.nitroBar.classList.toggle('locked', v));
  // Reticle: proyeksi titik konvergensi peluru di depan pesawat
  _vc.copy(Player.pos).addScaledVector(Player.forward, CONFIG.weapons.convergeDistance).project(camera);
  const visible = _vc.z < 1 && Player.alive;
  const x = Math.round((_vc.x + 1) * 0.5 * window.innerWidth);
  const y = Math.round((1 - _vc.y) * 0.5 * window.innerHeight);
  hudSet('reticleVis', visible, (v) => { hud.reticle.style.visibility = v ? 'visible' : 'hidden'; });
  hudSet('reticle', x * 100000 + y, () => { hud.reticle.style.transform = `translate(${x}px, ${y}px)`; });
}

/* =====================================================================
   INPUT - keyboard berbasis KeyboardEvent.code (posisi fisik tombol)
   ===================================================================== */
const Input = {
  down: Object.create(null),   // code -> boolean
  // Sumbu dan aksi yang dibaca oleh gameplay
  get pitch() { return (this.down.KeyW ? 1 : 0) - (this.down.KeyS ? 1 : 0); },
  get yaw() { return (this.down.KeyA ? 1 : 0) - (this.down.KeyD ? 1 : 0); },
  get nitro() { return !!this.down.Space; },
  get fire() { return !!(this.down.Enter || this.down.NumpadEnter); },
  reset() { for (const k in this.down) this.down[k] = false; },
};

// Tombol yang aksi bawaan browsernya harus dicegah (scroll, klik tombol yang sedang fokus)
const PREVENT_CODES = new Set(['Space', 'Enter', 'NumpadEnter']);
const GAME_CODES = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'Enter', 'NumpadEnter', 'KeyP', 'Escape', 'KeyR', 'KeyM']);

function onKeyDown(e) {
  if (!GAME_CODES.has(e.code)) return;
  if (PREVENT_CODES.has(e.code)) e.preventDefault();
  Input.down[e.code] = true;
  if (e.repeat) return;
  onAudioGesture();
  switch (e.code) {
    case 'KeyP':
    case 'Escape':
      togglePause();
      break;
    case 'KeyR':
      restartGame();
      break;
    case 'KeyM':
      toggleMute();
      break;
    case 'Enter':
    case 'NumpadEnter':
      // Enter di layar judul atau game over langsung memulai (jeda singkat agar tembakan tidak ikut restart)
      if (Game.state === 'menu') startGame();
      else if (Game.state === 'gameover' && Game.stateTime > 1.0) restartGame();
      break;
  }
}

function onKeyUp(e) {
  if (!GAME_CODES.has(e.code)) return;
  if (PREVENT_CODES.has(e.code)) e.preventDefault();
  Input.down[e.code] = false;
}

// Reset semua tombol saat jendela kehilangan fokus agar tidak ada tombol "nyangkut"
function onBlur() {
  Input.reset();
  if (Game.state === 'play') setState('pause');
}
function onVisibility() {
  Input.reset();
  if (document.hidden && Game.state === 'play') setState('pause');
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', onBlur);
document.addEventListener('visibilitychange', onVisibility);

// Mute global; audio sebenarnya disambungkan di bagian AUDIO
function toggleMute() {
  Game.muted = !Game.muted;
}
// Dipanggil pada setiap interaksi pengguna; bagian AUDIO mengisi implementasinya
function onAudioGesture() {}

/* =====================================================================
   UPDATE DAN RENDER
   ===================================================================== */

function update(dt) {
  Game.stateTime += dt;
  if (Game.state === 'play') {
    Game.time += dt;
    Player.updateNitro(dt, Input.nitro);
    Player.update(dt, Input.pitch, Input.yaw);
    updateTerrainCollision(dt);
    Weapons.update(dt, Input.fire);
    Rings.update(dt);
    Pickups.update(dt);
    Waves.update(dt);
    Enemies.update(dt);
    updateCombat();
    Combo.update(dt);
    Game.score += CONFIG.score.perSecond * dt;
  } else if (Game.state === 'dying') {
    // Pesawat sudah meledak: dunia tetap berjalan sebentar sebelum layar game over
    Weapons.update(dt, false);
    Enemies.update(dt);
    if (Game.stateTime > 1.8) {
      setState('gameover');
      Events.emit('gameover');
    }
  } else if (Game.state === 'menu') {
    Player.autopilot(dt, Game.stateTime);
  }
  if (Game.state !== 'pause') {
    Player.updateVisuals(dt, Game.stateTime);
    World.update(Player.pos.x, Player.pos.z);
    CamRig.update(dt);
    Env.update();
  }
}

function render() {
  Weapons.pool.sync();
  Enemies.bullets.sync();
  if (Game.state !== 'menu') updateHud();
  renderer.render(scene, camera);
}


/* =====================================================================
   HOOK DEBUG - window.__game untuk uji otomatis (ringkas dan aman)
   ===================================================================== */
const round2 = (v) => Math.round(v * 100) / 100;
window.__game = {
  // Ringkasan state yang aman dibaca (salinan nilai, bukan referensi objek internal)
  snapshot() {
    return {
      state: Game.state,
      time: round2(Game.time),
      score: Math.floor(Game.score),
      kills: Game.kills,
      seed: Game.seed,
      health: round2(Player.health),
      alive: Player.alive,
      nitro: round2(Player.nitro),
      nitroActive: Player.nitroActive,
      nitroLocked: Player.nitroLock > 0,
      speed: round2(Player.speed),
      yaw: round2(Player.yaw), pitch: round2(Player.pitch), roll: round2(Player.roll),
      position: { x: round2(Player.pos.x), y: round2(Player.pos.y), z: round2(Player.pos.z) },
      wave: Waves.wave,
      enemies: Enemies.alive,
      playerBullets: Weapons.pool.alive,
      enemyBullets: Enemies.bullets.alive,
      shotsFired: Weapons.shotsFired,
      muted: Game.muted,
      multiplier: Combo.multiplier,
      combo: Combo.count,
      ringsPassed: Rings.passed,
      pickupsCollected: Pickups.collected,
      warning: Player.warning,
      invulnerable: Player.invuln > 0,
    };
  },
  // Kunci seed dunia dan gameplay; berlaku pada sesi berikutnya (start atau restart)
  setSeed(n) { Debug.fixedSeed = n === null ? null : (n >>> 0); },
  start() { if (Game.state === 'menu' || Game.state === 'gameover') startGame(); },
  restart() { restartGame(); },
  debug: {
    setGod(v) { Debug.god = !!v; },
    setEnemiesEnabled(v) { Debug.enemiesEnabled = !!v; if (!v) Enemies.reset(); },
    damagePlayer(n) { Player.damage(n, 'debug'); },
    spawnEnemy(type, dist, lateral) { return !!Enemies.spawnAhead(type, dist, lateral); },
    killAllEnemies() { for (const e of Enemies.list) if (e.active) Enemies.destroy(e, true); },
    // Taruh cincin tepat di jalur terbang pemain (jarak dalam unit)
    placeRingAhead(dist = 120) {
      for (const it of Rings.items) { it.active = false; it.group.visible = false; }
      const P = Player.pos, f = Player.forward;
      return !!Rings.place(P.x + f.x * dist, P.y + f.y * dist, P.z + f.z * dist, Player.yaw);
    },
    placePickupAhead(type = 'repair', dist = 120) {
      const P = Player.pos, f = Player.forward;
      return !!Pickups.place(type, P.x + f.x * dist, P.y + f.y * dist, P.z + f.z * dist);
    },
  },
};

/* =====================================================================
   MAIN LOOP - requestAnimationFrame dengan delta time yang di-clamp
   ===================================================================== */
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(Math.max((now - lastTime) / 1000, 0), CONFIG.maxDelta);
  lastTime = now;
  Game.frame++;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
