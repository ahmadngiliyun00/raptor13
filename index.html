<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAPTOR13</title>
<meta name="description" content="RAPTOR13 - game pesawat 3D arcade di browser. Superioritas udara dimulai dari sini.">
<link rel="icon" href="data:,">
<style>
  :root {
    --ui-fg: #e8eef5;
    --ui-dim: #9fb0c2;
    --ui-accent: #ff9a3c;
    --ui-good: #5fe08a;
    --ui-bad: #ff4d4d;
    --ui-panel: rgba(10, 18, 28, 0.55);
    --ui-line: rgba(200, 220, 240, 0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1622; color: var(--ui-fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* Layar overlay (judul, jeda, game over) */
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(8, 14, 24, 0.35) 0%, rgba(8, 14, 24, 0.82) 100%);
    text-align: center; z-index: 20;
  }
  .btn {
    font: 700 18px/1 inherit; font-family: inherit; letter-spacing: 0.18em;
    color: #0b1622; background: var(--ui-accent); border: 0; border-radius: 4px;
    padding: 14px 34px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.secondary { background: transparent; color: var(--ui-fg); border: 1px solid var(--ui-line); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .bar { position: relative; width: 220px; height: 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--ui-line); border-radius: 2px; overflow: hidden; }
  .bar > i { position: absolute; inset: 0; transform-origin: left center; display: block; }
  #nitro-fill { background: linear-gradient(90deg, #ff7a1a, #ffd24a); }
  #nitro-bar.locked #nitro-fill { background: #7a3d22; }
  #nitro-bar.locked { animation: blink 0.35s steps(2) infinite; }
  @keyframes blink { 50% { border-color: var(--ui-bad); } }
  #reticle {
    position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border: 2px solid rgba(170, 255, 230, 0.85); border-radius: 50%;
    will-change: transform;
  }
  #reticle::before, #reticle::after { content: ""; position: absolute; background: rgba(170, 255, 230, 0.85); }
  #reticle::before { left: 50%; top: -9px; bottom: -9px; width: 2px; margin-left: -1px; clip-path: polygon(0 0, 100% 0, 100% 9px, 0 9px, 0 calc(100% - 9px), 100% calc(100% - 9px), 100% 100%, 0 100%); }
  #reticle::after { top: 50%; left: -9px; right: -9px; height: 2px; margin-top: -1px; clip-path: polygon(0 0, 9px 0, 9px 100%, 0 100%, calc(100% - 9px) 0, 100% 0, 100% 100%, calc(100% - 9px) 100%); }
</style>

<script type="module">
import * as THREE from 'three';

/* =====================================================================

const QUALITY_PRESETS = {

const CONFIG = {
  qualityPreset: 'sedang',     // rendah | sedang | tinggi (bisa ditimpa lewat ?kualitas=)
  maxDelta: 0.05,              // batas atas delta time per frame (detik)
  seed: 1337,                  // seed dunia di layar judul
  randomSeedPerRun: true,      // tiap sesi main memakai seed baru (kecuali dikunci lewat __game.setSeed)
  camera: {
    fov: 68,                   // FOV normal
    nitroFov: 84,              // FOV melebar saat nitro
    near: 0.5,
    distance: 14,              // jarak di belakang pesawat

    nitroPullBack: 3.5,        // tambahan jarak saat nitro

    pitchFollow: 0.55,         // seberapa besar kamera ikut pitch pesawat
    rollFollow: 0.2,           // seberapa besar kamera ikut miring
    shakeDecay: 1.8,           // trauma berkurang per detik
    shakeHit: 0.9,             // amplitudo getar saat kena hit (unit)
    shakeNitro: 0.08,          // getar halus konstan saat nitro
  },
  world: {
    waterLevel: 0,
    chunkSize: 200,            // ukuran satu potong terrain (unit)
    chunkSegments: 20,         // jumlah sel per sisi potong terrain
    rebuildsPerFrame: 3,       // batas potong terrain yang dibangun ulang per frame
    baseFreq: 1 / 520,         // frekuensi noise bukit
    hillHeight: 48,
    baseHeight: 9,
    mountainMaskFreq: 1 / 1500,
    ridgeFreq: 1 / 360,
    mountainHeight: 115,
  },
  nitro: {
    drainPerSec: 0.28,         // meter penuh habis sekitar 3,5 detik
    regenPerSec: 0.085,        // pulih pelan saat tidak dipakai
    regenDelay: 0.8,           // jeda sebelum mulai pulih setelah dilepas
    lockoutTime: 2.0,          // jeda wajib setelah meter benar-benar habis
  },
  weapons: {
    fireInterval: 0.09,        // cooldown antar tembakan (detik)
    bulletSpeed: 330,          // ditambah kecepatan pesawat
    bulletLife: 1.4,
    damage: 1,
    maxPlayerBullets: 80,
    convergeDistance: 160,     // jarak titik temu peluru kedua sayap, juga posisi reticle
    hitPadding: 0.9,           // tambahan radius saat cek kena
  },
  enemies: {
    maxDrones: 16,             // ukuran pool drone
    maxGunships: 8,            // ukuran pool pesawat penembak
    maxBullets: 140,           // ukuran pool peluru musuh
    bulletLife: 3.0,
    spawnDistance: [380, 480], // jarak muncul di depan pemain
    despawnDistance: 1150,
    drone: { hp: 3, speed: 46, agility: 1.5, radius: 2.3, contactDamage: 18, score: 100 },
    gunship: {
      hp: 8, speed: 84, turnRate: 0.95, radius: 3.4, contactDamage: 30, score: 300,
      fireInterval: 1.15, fireRange: 320, fireCone: 0.33, burst: 2,
      bulletSpeed: 175, bulletDamage: 7, extendTime: 3.2,
    },
  },
  waves: {
    firstDelay: 2.5,           // jeda sebelum gelombang pertama
    breakTime: 3.5,            // jeda antar gelombang
    spawnInterval: 1.3,
    maxDuration: 55,           // gelombang berikut dimulai walau musuh masih tersisa
    difficultyStep: 0.09,      // kenaikan kesulitan per gelombang
    maxDifficulty: 1.9,
  },
  score: { perSecond: 5 },

    step: 0.5,                 // tambahan multiplier per kill beruntun
    maxMultiplier: 5,
  },
  rings: {
    radius: 10,
    maxActive: 2,              // jumlah cincin aktif sekaligus (berantai)
    spacing: [240, 320],       // jarak antar cincin
    score: 250,
    nitroBonus: 0.2,
  },
  pickups: {
    interval: [13, 21],        // rentang detik antar kemunculan
    radius: 7,
    repairAmount: 30,
    nitroAmount: 0.5,
  },
  obstacles: {
    pillarsPerChunk: 2,
    pillarChance: 0.55,
    terrainDamage: 35,
    pillarDamage: 40,
    invulnTime: 1.0,           // kebal tabrakan sesaat setelah menabrak
    warnAhead: 150,            // jarak cek peringatan medan di depan
  },
  sky: {
    zenith: 0x4a86c8,
    horizon: 0xe6d5bd,         // juga dipakai sebagai warna fog
    sunColor: 0xffd9a0,
    sunElevation: 32,          // derajat
    sunAzimuth: 115,           // derajat ke kanan dari arah awal pemain
    fogNearFactor: 0.3,        // fog mulai pada fraksi jarak pandang
  },
  light: {
    sunColor: 0xffe0b5,
    sunIntensity: 2.4,
    hemiSky: 0x9cc8ff,
    hemiGround: 0x6b8f4a,
    hemiIntensity: 1.5,
    nitroLightIntensity: 45,
    shadowFrustum: 120,        // lebar kotak shadow yang mengikuti pemain
    shadowBias: -0.0005,
    shadowNormalBias: 0.04,
  },
  player: {
    startAltitude: 110,
    baseSpeed: 70,             // unit per detik
    nitroSpeed: 128,
    accel: 1.6,                // respons perubahan kecepatan
    maxPitch: 0.62,            // radian, batas sudut hidung naik atau turun
    maxRoll: 1.05,             // radian, batas kemiringan sayap saat belok
    pitchResponse: 3.2,
    rollResponse: 4.0,
    turnRate: 1.15,            // radian per detik pada kemiringan penuh
    minAltitude: 6,            // jarak minimum di atas permukaan air
    maxAltitude: 260,
    radius: 2.6,               // radius tabrakan
    maxHealth: 100,
  },
};

// Pilih preset kualitas dari URL bila ada, misalnya index.html?kualitas=rendah
(() => {
  try {
    const q = new URLSearchParams(location.search).get('kualitas');
    if (q && QUALITY_PRESETS[q]) CONFIG.qualityPreset = q;
  } catch (err) { /* abaikan, pakai default */ }
})();
const Q = QUALITY_PRESETS[CONFIG.qualityPreset];

/* =====================================================================
   UTIL - matematika kecil dan random ber-seed
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
// Damping eksponensial yang tidak bergantung frame rate
const damp = (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt));
const wrapAngle = (a) => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const dampAngle = (a, b, lambda, dt) => a + wrapAngle(b - a) * (1 - Math.exp(-lambda * dt));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// mulberry32: PRNG kecil ber-seed, dipakai untuk semua random gameplay agar bisa diuji ulang
function makeRng(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.reseed = (n) => { s = n >>> 0; };
  return rng;
}
const rand = makeRng(CONFIG.seed);
const randRange = (a, b) => a + (b - a) * rand();

// Event bus kecil: efek, audio dan HUD mendaftar sekali saat init, jadi restart tidak menumpuk listener
const Events = {
  map: Object.create(null),
  on(name, fn) { (this.map[name] || (this.map[name] = [])).push(fn); },
  emit(name, a, b, c, d) {
    const list = this.map[name];
    if (list) for (let i = 0; i < list.length; i++) list[i](a, b, c, d);
  },
};

// Saklar debug (dipakai uji otomatis lewat window.__game)
const Debug = { god: false, enemiesEnabled: true, fixedSeed: null };

// Uji tabrakan segmen (gerak peluru satu frame) terhadap bola, tanpa alokasi
function segmentHitsSphere(ax, ay, az, bx, by, bz, cx, cy, cz, r) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const fx = cx - ax, fy = cy - ay, fz = cz - az;
  const len2 = dx * dx + dy * dy + dz * dz;
  let t = len2 > 0 ? (fx * dx + fy * dy + fz * dz) / len2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + dx * t - cx, qy = ay + dy * t - cy, qz = az + dz * t - cz;
  return qx * qx + qy * qy + qz * qz <= r * r;
}

/* =====================================================================
   RENDERER, SCENE, KAMERA
   ===================================================================== */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias: Q.antialias, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pixelRatioMax, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

renderer.shadowMap.enabled = Q.shadows;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, window.innerWidth / window.innerHeight, CONFIG.camera.near, 2000);
camera.position.set(0, 3, 10);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pixelRatioMax, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

/* =====================================================================
   GEOMETRI PROSEDURAL - pembantu untuk model low-poly flat-shaded
   ===================================================================== */
// Menyusun segitiga non-indexed; orientasi tiap segitiga dibalik otomatis bila normalnya
// berlawanan dengan arah petunjuk (hx, hy, hz) sehingga semua sisi menghadap keluar.
class FacetBuilder {
  constructor() { this.pos = []; }
  tri(a, b, c, hx, hy, hz) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * hx + ny * hy + nz * hz < 0) this.pos.push(a[0], a[1], a[2], c[0], c[1], c[2], b[0], b[1], b[2]);
    else this.pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  }
  quad(a, b, c, d, hx, hy, hz) { this.tri(a, b, c, hx, hy, hz); this.tri(a, c, d, hx, hy, hz); }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.computeVertexNormals(); // non-indexed: normal per sisi, jadi tampak flat
    return g;
  }
}

// Badan pesawat dari beberapa penampang bersudut (chine) yang disambung sepanjang sumbu Z
function loftGeometry(sections) {
  const ring = (s) => {
    const { z, w, ht, hb } = s, y = s.y || 0;
    return [
      [0, y + ht, z], [w * 0.55, y + ht * 0.78, z], [w, y, z], [w * 0.62, y - hb, z],
      [0, y - hb, z], [-w * 0.62, y - hb, z], [-w, y, z], [-w * 0.55, y + ht * 0.78, z],
    ];
  };
  const rings = sections.map(ring);
  const fb = new FacetBuilder();
  const n = rings[0].length;
  for (let i = 0; i < rings.length - 1; i++) {
    for (let k = 0; k < n; k++) {
      const a = rings[i][k], b = rings[i][(k + 1) % n], c = rings[i + 1][(k + 1) % n], d = rings[i + 1][k];
      const cy = (sections[i].y || 0);
      fb.quad(a, b, c, d, (a[0] + b[0] + c[0] + d[0]) / 4, (a[1] + b[1] + c[1] + d[1]) / 4 - cy, 0);
    }
  }
  const capFan = (r, s, hz) => {
    const center = [0, s.y || 0, s.z];
    for (let k = 0; k < n; k++) fb.tri(center, r[k], r[(k + 1) % n], 0, 0, hz);
  };
  capFan(rings[0], sections[0], -1);
  capFan(rings[rings.length - 1], sections[sections.length - 1], 1);
  return fb.build();
}

// Pelat datar dari poligon cembung di bidang XZ (sayap, stabilizer, sirip)
function slabGeometry(poly, thickness) {
  const fb = new FacetBuilder();
  const t = thickness / 2, n = poly.length;
  let cx = 0, cz = 0;
  for (const p of poly) { cx += p[0] / n; cz += p[1] / n; }
  const top = poly.map(([x, z]) => [x, t, z]);
  const bot = poly.map(([x, z]) => [x, -t, z]);
  for (let i = 1; i < n - 1; i++) {
    fb.tri(top[0], top[i], top[i + 1], 0, 1, 0);
    fb.tri(bot[0], bot[i], bot[i + 1], 0, -1, 0);
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const hx = (poly[i][0] + poly[j][0]) / 2 - cx, hz = (poly[i][1] + poly[j][1]) / 2 - cz;
    fb.quad(top[i], top[j], bot[j], bot[i], hx, 0, hz);
  }
  return fb.build();
}
const mirrorPoly = (poly) => poly.map(([x, z]) => [-x, z]);

/* =====================================================================
   PESAWAT PEMAIN - model prosedural orisinal bergaya jet siluman
   Hidung menghadap -Z. Bentuk bersudut, dua mesin, dua sirip ekor miring.
   ===================================================================== */
function buildPlayerModel() {
  const root = new THREE.Group();
  root.rotation.order = 'YXZ';
  const body = new THREE.Group();
  root.add(body);

  const matBody = new THREE.MeshPhongMaterial({ color: 0x66727f, specular: 0x2c3846, shininess: 30, flatShading: true });
  const matPanel = new THREE.MeshPhongMaterial({ color: 0x55606c, specular: 0x222c38, shininess: 24, flatShading: true });
  const matDark = new THREE.MeshPhongMaterial({ color: 0x353c45, specular: 0x161b22, shininess: 16, flatShading: true });
  const matCanopy = new THREE.MeshPhongMaterial({ color: 0x1a2633, specular: 0xffcf7a, shininess: 90, flatShading: true });
  const matNozzle = new THREE.MeshPhongMaterial({ color: 0x2a2d32, specular: 0x111111, shininess: 10, flatShading: true });
  const matIntake = new THREE.MeshBasicMaterial({ color: 0x0b0d10 });
  const matGlow = new THREE.MeshBasicMaterial({ color: 0xff9a40 });
  const matFlame = new THREE.MeshBasicMaterial({
    color: 0xff8a2a, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const matNavL = new THREE.MeshBasicMaterial({ color: 0xff3030 });
  const matNavR = new THREE.MeshBasicMaterial({ color: 0x30ff70 });

  const add = (geo, mat, x = 0, y = 0, z = 0, shadow = true) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = shadow;
    m.receiveShadow = shadow;
    body.add(m);
    return m;
  };

  // Badan utama dengan penampang chine
  add(loftGeometry([
    { z: -4.7, w: 0.03, ht: 0.03, hb: 0.03, y: -0.05 },
    { z: -3.7, w: 0.36, ht: 0.24, hb: 0.18, y: -0.03 },
    { z: -2.3, w: 0.72, ht: 0.46, hb: 0.3 },
    { z: -0.6, w: 1.08, ht: 0.5, hb: 0.36 },
    { z: 1.6, w: 1.14, ht: 0.42, hb: 0.36 },
    { z: 3.4, w: 0.98, ht: 0.34, hb: 0.3 },
    { z: 3.85, w: 0.9, ht: 0.3, hb: 0.28 },
  ]), matBody);

  // Sayap utama trapesium dengan sapuan depan sekitar 40 derajat
  const wingR = [[0.8, -1.3], [4.7, 1.9], [4.7, 2.55], [0.8, 2.95]];
  add(slabGeometry(wingR, 0.14), matPanel, 0, -0.06, 0);
  add(slabGeometry(mirrorPoly(wingR), 0.14), matPanel, 0, -0.06, 0);
  // Perpanjangan akar sayap ke arah hidung
  const lerxR = [[0.7, -2.7], [1.15, -1.2], [1.15, 0.4], [0.7, 0.4]];
  add(slabGeometry(lerxR, 0.1), matBody, 0, 0.0, 0);
  add(slabGeometry(mirrorPoly(lerxR), 0.1), matBody, 0, 0.0, 0);

  // Stabilizer horizontal
  const stabR = [[0.75, 3.0], [2.65, 3.85], [2.65, 4.35], [0.75, 4.25]];
  add(slabGeometry(stabR, 0.1), matPanel, 0, -0.04, 0);
  add(slabGeometry(mirrorPoly(stabR), 0.1), matPanel, 0, -0.04, 0);

  // Dua sirip tegak yang miring keluar (dibangun di bidang XZ lalu diputar)
  const finPoly = [[0, 1.75], [1.9, 3.05], [1.9, 3.6], [0, 3.7]];
  const finR = slabGeometry(finPoly, 0.1); finR.rotateZ(THREE.MathUtils.degToRad(64));
  const finL = slabGeometry(finPoly, 0.1); finL.rotateZ(THREE.MathUtils.degToRad(116));
  add(finR, matBody, 0.78, 0.28, 0);
  add(finL, matBody, -0.78, 0.28, 0);

  // Kanopi kokpit
  const canopy = new THREE.SphereGeometry(0.5, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2);
  canopy.scale(0.62, 0.78, 2.7);
  add(canopy, matCanopy, 0, 0.34, -2.05);

  // Saluran udara masuk bersudut di kedua sisi
  for (const s of [-1, 1]) {
    const intake = add(new THREE.BoxGeometry(0.5, 0.62, 1.9), matDark, s * 1.05, -0.1, -0.35);
    intake.rotation.set(0, s * 0.07, s * -0.14);
    const mouth = add(new THREE.BoxGeometry(0.4, 0.5, 0.04), matIntake, s * 1.0, -0.1, -1.31, false);
    mouth.rotation.copy(intake.rotation);
  }

  // Dua mesin dengan nozzle kotak, glow, dan nyala api (diperbesar saat nitro)
  const flames = [];
  const flameGeo = new THREE.ConeGeometry(0.24, 2.2, 7, 1, true);
  flameGeo.rotateX(Math.PI / 2);
  flameGeo.translate(0, 0, 1.1);
  for (const s of [-1, 1]) {
    add(new THREE.BoxGeometry(0.62, 0.52, 0.9), matNozzle, s * 0.48, -0.02, 4.2);
    add(new THREE.BoxGeometry(0.46, 0.36, 0.04), matGlow, s * 0.48, -0.02, 4.66, false);
    const f = add(flameGeo, matFlame, s * 0.48, -0.02, 4.68, false);
    f.scale.set(1, 1, 0.4);
    flames.push(f);
  }

  // Lampu navigasi di ujung sayap
  const navGeo = new THREE.SphereGeometry(0.09, 6, 4);
  add(navGeo, matNavL, -4.65, -0.04, 2.3, false);
  add(navGeo, matNavR, 4.65, -0.04, 2.3, false);

  // Cahaya mesin, intensitas 0 saat normal dan naik saat nitro.
  // Lampu tidak pernah disembunyikan agar jumlah lampu tetap dan shader tidak dikompilasi ulang.
  const light = new THREE.PointLight(0xff8a3a, 0, 28, 2);
  light.position.set(0, 0.2, 5.4);
  root.add(light);

  return {
    root, body, flames, light, matGlow, matFlame,
    nozzles: [new THREE.Vector3(-0.48, -0.02, 4.75), new THREE.Vector3(0.48, -0.02, 4.75)],
    guns: [new THREE.Vector3(-1.25, -0.12, -1.2), new THREE.Vector3(1.25, -0.12, -1.2)],
    wingtips: [new THREE.Vector3(-4.65, -0.04, 2.4), new THREE.Vector3(4.65, -0.04, 2.4)],
  };
}

const PlayerModel = buildPlayerModel();
scene.add(PlayerModel.root);

// Ketinggian permukaan (daratan atau air) di titik x, z. Diganti oleh bagian DUNIA.
let groundHeightAt = (x, z) => CONFIG.world.waterLevel;

const Player = {
  model: PlayerModel,
  pos: PlayerModel.root.position,
  vel: new THREE.Vector3(),
  forward: new THREE.Vector3(0, 0, -1),
  yaw: 0, pitch: 0, roll: 0,
  speed: 0,
  health: 100,
  alive: true,
  nitro: 1,            // meter nitro 0..1
  nitroLock: 0,        // sisa jeda setelah meter habis
  nitroRegenWait: 0,   // sisa jeda sebelum meter mulai pulih
  nitroActive: false,
  nitroFx: 0,          // 0..1 dihaluskan, dipakai kamera, cahaya mesin dan api
  invuln: 0,           // sisa waktu kebal tabrakan
  warning: false,      // peringatan medan di depan

  reset() {
    const C = CONFIG.player;
    this.pos.set(0, World.safeStartAltitude(), 0);
    this.yaw = 0; this.pitch = 0; this.roll = 0;
    this.speed = C.baseSpeed;
    this.health = C.maxHealth;
    this.alive = true;
    this.nitro = 1;
    this.nitroLock = 0;
    this.nitroRegenWait = 0;
    this.nitroActive = false;
    this.nitroFx = 0;
    this.invuln = 0;
    this.warning = false;
    this.forward.set(0, 0, -1);
    this.vel.set(0, 0, -this.speed);
    this.model.root.visible = true;
    this.model.root.rotation.set(0, 0, 0);
  },

  // Fisika arcade: pesawat selalu maju, kontrol mengatur target sudut yang di-damping
  update(dt, pitchIn, yawIn) {
    const C = CONFIG.player;
    let targetPitch = pitchIn * C.maxPitch;

    // Plafon: hidung dipaksa turun saat mendekati ketinggian maksimum
    const ceilRoom = C.maxAltitude - this.pos.y;
    if (ceilRoom < 25 && targetPitch > 0) targetPitch *= clamp(ceilRoom / 25, 0, 1);
    if (ceilRoom <= 0) targetPitch = Math.min(targetPitch, -0.12);
    // Lantai: tidak bisa menukik di bawah ketinggian minimum di atas air
    const floorY = CONFIG.world.waterLevel + C.minAltitude;
    if (this.pos.y < floorY + 10 && targetPitch < 0) targetPitch *= clamp((this.pos.y - floorY) / 10, 0, 1);

    this.pitch = damp(this.pitch, targetPitch, C.pitchResponse, dt);
    this.roll = damp(this.roll, yawIn * C.maxRoll, C.rollResponse, dt);
    // Laju belok sebanding dengan kemiringan sayap, sehingga bank dan belok selalu selaras
    this.yaw += C.turnRate * (this.roll / C.maxRoll) * dt;

    this.nitroFx = damp(this.nitroFx, this.nitroActive ? 1 : 0, 5, dt);
    const targetSpeed = this.nitroActive ? C.nitroSpeed : C.baseSpeed;
    this.speed = damp(this.speed, targetSpeed, this.nitroActive ? C.accel * 1.6 : C.accel, dt);

    const cp = Math.cos(this.pitch);
    this.forward.set(-Math.sin(this.yaw) * cp, Math.sin(this.pitch), -Math.cos(this.yaw) * cp);
    this.vel.copy(this.forward).multiplyScalar(this.speed);
    this.pos.addScaledVector(this.vel, dt);

    if (this.pos.y > C.maxAltitude) this.pos.y = C.maxAltitude;
    if (this.pos.y < floorY) {
      this.pos.y = floorY;
      if (this.pitch < 0) this.pitch = damp(this.pitch, 0, 8, dt);
    }
    this.model.root.rotation.set(this.pitch, this.yaw, this.roll);
  },

  // Meter nitro: terkuras saat dipakai, pulih pelan setelah jeda, terkunci sebentar bila habis
  updateNitro(dt, want) {
    const N = CONFIG.nitro;
    if (this.nitroLock > 0) this.nitroLock = Math.max(0, this.nitroLock - dt);
    this.nitroActive = want && this.alive && this.nitroLock <= 0 && this.nitro > 0;
    if (this.nitroActive) {
      this.nitro -= N.drainPerSec * dt;
      this.nitroRegenWait = N.regenDelay;
      if (this.nitro <= 0) {
        this.nitro = 0;
        this.nitroActive = false;
        this.nitroLock = N.lockoutTime;
      }
    } else {
      this.nitroRegenWait -= dt;
      if (this.nitroRegenWait <= 0) this.nitro = Math.min(1, this.nitro + N.regenPerSec * dt);
    }
  },
  addNitro(amount) { this.nitro = Math.min(1, this.nitro + amount); },
  heal(amount) { this.health = Math.min(CONFIG.player.maxHealth, this.health + amount); },

  damage(amount, source) {
    if (!this.alive || Debug.god || Game.state !== 'play') return;
    this.health = Math.max(0, this.health - amount);
    CamRig.addTrauma(clamp(amount / 30, 0.3, 0.9));
    Events.emit('playerHit', amount, source);
    if (this.health <= 0) this.die();
  },

  die() {
    this.alive = false;
    this.nitroActive = false;
    this.model.root.visible = false;
    CamRig.addTrauma(1);
    Events.emit('playerDeath', this.pos);
    setState('dying');
  },

  // Api mesin, glow dan cahaya mengikuti intensitas nitro
  updateVisuals(dt, t) {
    const m = this.model, nf = this.nitroFx;
    const flicker = 0.9 + 0.1 * Math.sin(t * 61) + 0.06 * Math.sin(t * 97);
    for (const f of m.flames) f.scale.set(1 + nf * 0.5, 1 + nf * 0.5, (0.45 + nf * 2.0) * flicker);
    m.matFlame.opacity = 0.3 + 0.6 * nf;
    m.light.intensity = nf * CONFIG.light.nitroLightIntensity * flicker;
    m.matGlow.color.lerpColors(this._glowBase, this._glowHot, nf);
  },
  _glowBase: new THREE.Color(0xff9a40),
  _glowHot: new THREE.Color(0xfff0c0),

  // Autopilot untuk latar layar judul: meliuk pelan dan menjaga ketinggian
  autopilot(dt, t) {
    // Lihat ke depan agar tidak menabrak lereng di jalur terbang
    let ground = groundHeightAt(this.pos.x, this.pos.z);
    for (let d = 60; d <= 300; d += 60) {
      ground = Math.max(ground, groundHeightAt(this.pos.x - Math.sin(this.yaw) * d, this.pos.z - Math.cos(this.yaw) * d));
    }
    const targetY = Math.min(ground + 60, CONFIG.player.maxAltitude - 10);
    const pitchIn = clamp((targetY - this.pos.y) * 0.05, -0.5, 1);
    const yawIn = Math.sin(t * 0.23) * 0.45;
    this.update(dt, pitchIn, yawIn);
    if (this.pos.y < ground + 35) this.pos.y = ground + 35;
  },
};

/* =====================================================================
   NOISE - simplex noise 2D kecil dengan permutasi ber-seed
   ===================================================================== */
const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
const GRAD_X = new Float32Array([1, -1, 1, -1, 1, -1, 0, 0]);
const GRAD_Y = new Float32Array([1, 1, -1, -1, 0, 0, 1, -1]);
class SimplexNoise2D {
  constructor(random) {
    this.perm = new Uint8Array(512);
    this.pmod = new Uint8Array(512);
    this.reseed(random);
  }
  reseed(random) {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(random() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) { this.perm[i] = p[i & 255]; this.pmod[i] = this.perm[i] & 7; }
  }
  noise(xin, yin) {
    const perm = this.perm, pmod = this.pmod;
    const s = (xin + yin) * F2;
    const i = Math.floor(xin + s), j = Math.floor(yin + s);
    const t = (i + j) * G2;
    const x0 = xin - (i - t), y0 = yin - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
    const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, tt, g;
    tt = 0.5 - x0 * x0 - y0 * y0;
    if (tt > 0) { g = pmod[ii + perm[jj]]; tt *= tt; n += tt * tt * (GRAD_X[g] * x0 + GRAD_Y[g] * y0); }
    tt = 0.5 - x1 * x1 - y1 * y1;
    if (tt > 0) { g = pmod[ii + i1 + perm[jj + j1]]; tt *= tt; n += tt * tt * (GRAD_X[g] * x1 + GRAD_Y[g] * y1); }
    tt = 0.5 - x2 * x2 - y2 * y2;
    if (tt > 0) { g = pmod[ii + 1 + perm[jj + 1]]; tt *= tt; n += tt * tt * (GRAD_X[g] * x2 + GRAD_Y[g] * y2); }
    return 70 * n; // kira-kira -1..1
  }
}

// Hash integer deterministik untuk variasi warna dan penempatan objek per sel
function hash3(x, z, k) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ Math.imul(k | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const imod = (a, n) => ((a % n) + n) % n;

/* =====================================================================
   DUNIA - terrain ber-potong yang di-recycle, laut, langit, matahari, fog, cahaya
   ===================================================================== */
const World = {
  C: CONFIG.world.chunkSize,
  S: CONFIG.world.chunkSegments,
  R: Q.chunkRadius,
  N: Q.chunkRadius * 2 + 1,
  noise: new SimplexNoise2D(makeRng(CONFIG.seed)),
  slots: [],
  material: new THREE.MeshLambertMaterial({ vertexColors: true }),
  viewDistance: Q.chunkRadius * CONFIG.world.chunkSize,
  palette: {
    seabed: new THREE.Color(0x7d9a7e), sand: new THREE.Color(0xd9c48f),
    grassLow: new THREE.Color(0x7aab4c), grass: new THREE.Color(0x5f9640),
    forest: new THREE.Color(0x467a38), rock: new THREE.Color(0x8a7e6c),
    rockDark: new THREE.Color(0x766b5d), rockHigh: new THREE.Color(0x9c9384),
    snow: new THREE.Color(0xeef1f3),
  },

  init() {
    const C = this.C, S = this.S, vCount = S * S * 6;
    for (let k = 0; k < this.N * this.N; k++) {
      const geo = new THREE.BufferGeometry();
      const pos = new THREE.BufferAttribute(new Float32Array(vCount * 3), 3).setUsage(THREE.DynamicDrawUsage);
      const nor = new THREE.BufferAttribute(new Float32Array(vCount * 3), 3).setUsage(THREE.DynamicDrawUsage);
      const col = new THREE.BufferAttribute(new Float32Array(vCount * 3), 3).setUsage(THREE.DynamicDrawUsage);
      geo.setAttribute('position', pos);
      geo.setAttribute('normal', nor);
      geo.setAttribute('color', col);
      // Bounding sphere tetap (koordinat lokal) agar frustum culling tidak perlu dihitung ulang
      geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(C / 2, 60, C / 2), C * 0.71 + 140);
      const mesh = new THREE.Mesh(geo, this.material);
      mesh.receiveShadow = Q.shadows;
      mesh.castShadow = false;
      mesh.matrixAutoUpdate = false;
      scene.add(mesh);
      this.slots.push({ mesh, geo, pos, nor, col, heights: new Float32Array((S + 1) * (S + 1)), cx: 1e9, cz: 1e9, built: false, index: k });
    }
  },

  setSeed(seed) { this.noise.reseed(makeRng(seed)); },

  // Ketinggian analitik dari noise
  heightRaw(x, z) {
    const n = this.noise, W = CONFIG.world;
    let e = 0, amp = 1, f = W.baseFreq, norm = 0;
    for (let o = 0; o < 4; o++) {
      e += amp * n.noise(x * f + o * 31.7, z * f - o * 17.3);
      norm += amp; amp *= 0.42; f *= 2.05;
    }
    e /= norm;
    const mask = smoothstep(0.05, 0.7, n.noise(x * W.mountainMaskFreq + 71.3, z * W.mountainMaskFreq - 12.9));
    const r = 1 - Math.abs(n.noise(x * W.ridgeFreq - 43.1, z * W.ridgeFreq + 91.7));
    let h = e * W.hillHeight + W.baseHeight + r * r * r * mask * W.mountainHeight;
    if (h < 0) h *= 0.6;
    return h;
  },

  // Ketinggian terrain persis sama dengan segitiga mesh (dipakai untuk tabrakan)
  heightAt(x, z) {
    const C = this.C, S = this.S, N = this.N, cell = C / S;
    const cx = Math.floor(x / C), cz = Math.floor(z / C);
    const slot = this.slots[imod(cx, N) + imod(cz, N) * N];
    const lx = (x - cx * C) / cell, lz = (z - cz * C) / cell;
    let i = Math.floor(lx), j = Math.floor(lz);
    if (i > S - 1) i = S - 1; if (j > S - 1) j = S - 1;
    if (i < 0) i = 0; if (j < 0) j = 0;
    const fx = lx - i, fz = lz - j;
    let h00, h10, h01, h11;
    if (slot.built && slot.cx === cx && slot.cz === cz) {
      const H = slot.heights, w = S + 1;
      h00 = H[j * w + i]; h10 = H[j * w + i + 1]; h01 = H[(j + 1) * w + i]; h11 = H[(j + 1) * w + i + 1];
    } else {
      const ox = cx * C, oz = cz * C;
      h00 = this.heightRaw(ox + i * cell, oz + j * cell);
      h10 = this.heightRaw(ox + (i + 1) * cell, oz + j * cell);
      h01 = this.heightRaw(ox + i * cell, oz + (j + 1) * cell);
      h11 = this.heightRaw(ox + (i + 1) * cell, oz + (j + 1) * cell);
    }
    if (fz > fx) return h00 + (h11 - h01) * fx + (h01 - h00) * fz;
    return h00 + (h10 - h00) * fx + (h11 - h10) * fz;
  },

  colorFor(h, ny, jitter, out) {
    const P = this.palette;
    let c;
    if (h < -1.5) c = P.seabed;
    else if (h < 3.5) c = P.sand;
    else if (h > 128 && ny > 0.62) c = P.snow;
    else if (ny < 0.74) c = h > 100 ? P.rockHigh : P.rockDark;
    else if (h > 105) c = P.rockHigh;
    else if (h > 80) c = P.rock;
    else if (h > 50) c = P.forest;
    else if (h > 22) c = P.grass;
    else c = P.grassLow;
    const j = 0.92 + jitter * 0.16;
    out[0] = c.r * j; out[1] = c.g * j; out[2] = c.b * j;
  },

  rebuild(slot, cx, cz) {
    const C = this.C, S = this.S, cell = C / S, w = S + 1, H = slot.heights;
    const ox = cx * C, oz = cz * C;
    for (let j = 0; j <= S; j++) for (let i = 0; i <= S; i++) H[j * w + i] = this.heightRaw(ox + i * cell, oz + j * cell);

    const P = slot.pos.array, Nn = slot.nor.array, Cc = slot.col.array, rgb = this._rgb;
    let p = 0;
    const writeTri = (ax, ay, az, bx, by, bz, cx2, cy, cz2, jitter) => {
      const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx2 - ax, vy = cy - ay, vz = cz2 - az;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      this.colorFor((ay + by + cy) / 3, ny, jitter, rgb);
      P[p] = ax; P[p + 1] = ay; P[p + 2] = az;
      P[p + 3] = bx; P[p + 4] = by; P[p + 5] = bz;
      P[p + 6] = cx2; P[p + 7] = cy; P[p + 8] = cz2;
      for (let k = 0; k < 9; k += 3) {
        Nn[p + k] = nx; Nn[p + k + 1] = ny; Nn[p + k + 2] = nz;
        Cc[p + k] = rgb[0]; Cc[p + k + 1] = rgb[1]; Cc[p + k + 2] = rgb[2];
      }
      p += 9;
    };
    for (let j = 0; j < S; j++) {
      for (let i = 0; i < S; i++) {
        const h00 = H[j * w + i], h10 = H[j * w + i + 1], h01 = H[(j + 1) * w + i], h11 = H[(j + 1) * w + i + 1];
        const x0 = i * cell, x1 = x0 + cell, z0 = j * cell, z1 = z0 + cell;
        const gx = cx * S + i, gz = cz * S + j;
        // Diagonal dari sudut 00 ke 11, cocok dengan rumus heightAt
        writeTri(x0, h00, z0, x0, h01, z1, x1, h11, z1, hash3(gx, gz, 1));
        writeTri(x0, h00, z0, x1, h11, z1, x1, h10, z0, hash3(gx, gz, 2));
      }
    }
    slot.pos.needsUpdate = true; slot.nor.needsUpdate = true; slot.col.needsUpdate = true;
    slot.cx = cx; slot.cz = cz; slot.built = true;
    slot.mesh.position.set(ox, 0, oz);
    slot.mesh.updateMatrix();
    this.onChunkRebuilt(slot);
  },
  _rgb: [0, 0, 0],
  onChunkRebuilt(slot) {},   // diisi bagian RINTANGAN

  // Recycle toroidal: slot (i, j) selalu memegang potong dengan cx mod N = i dan cz mod N = j
  update(px, pz, force = false) {
    const C = this.C, N = this.N, R = this.R;
    const bx = Math.floor(px / C) - R, bz = Math.floor(pz / C) - R;
    let budget = force ? Infinity : CONFIG.world.rebuildsPerFrame;
    for (let k = 0; k < this.slots.length && budget > 0; k++) {
      const slot = this.slots[k];
      const i = k % N, j = (k - i) / N;
      const cx = bx + imod(i - bx, N), cz = bz + imod(j - bz, N);
      if (slot.cx !== cx || slot.cz !== cz) { this.rebuild(slot, cx, cz); budget--; }
    }
  },

  reset(seed) {
    this.setSeed(seed);
    for (const slot of this.slots) { slot.built = false; slot.cx = 1e9; slot.cz = 1e9; }
    this.update(0, 0, true);
  },

  // Ketinggian awal yang aman: di atas puncak tertinggi di jalur awal pemain
  safeStartAltitude() {
    let maxH = CONFIG.world.waterLevel;
    for (let d = 0; d <= 600; d += 25) {
      for (let lat = -60; lat <= 60; lat += 30) maxH = Math.max(maxH, this.heightAt(lat, -d));
    }
    return clamp(Math.max(CONFIG.player.startAltitude, maxH + 35), 0, CONFIG.player.maxAltitude - 15);
  },
};
World.init();
groundHeightAt = (x, z) => Math.max(World.heightAt(x, z), CONFIG.world.waterLevel);

// Konversi hex ke nilai sRGB mentah untuk shader yang tidak memakai konversi ruang warna three.js
const srgbVec3 = (hex) => {
  const o = { r: 0, g: 0, b: 0 };
  new THREE.Color(hex).getRGB(o, THREE.SRGBColorSpace);
  return new THREE.Vector3(o.r, o.g, o.b);
};

const Env = {
  sunDir: new THREE.Vector3(),
  init() {
    const S = CONFIG.sky, L = CONFIG.light;
    const el = THREE.MathUtils.degToRad(S.sunElevation), az = THREE.MathUtils.degToRad(S.sunAzimuth);
    this.sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();

    // Fog dengan warna sama persis dengan horizon langit
    const fogFar = World.viewDistance * 0.97;
    scene.fog = new THREE.Fog(S.horizon, fogFar * S.fogNearFactor, fogFar);
    camera.far = fogFar * 1.3;
    camera.updateProjectionMatrix();

    // Langit gradient dengan halo matahari (shader, selalu di belakang semua objek)
    this.skyMat = new THREE.ShaderMaterial({
      uniforms: {
        uZenith: { value: srgbVec3(S.zenith) },
        uHorizon: { value: srgbVec3(S.horizon) },
        uSunColor: { value: srgbVec3(S.sunColor) },
        uSunDir: { value: this.sunDir },
      },
      vertexShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vDir = position;
          vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          gl_Position = p.xyww * vec4(1.0, 1.0, 0.99999, 1.0);
        }`,
      fragmentShader: /* glsl */`
        uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uSunColor; uniform vec3 uSunDir;
        varying vec3 vDir;
        void main() {
          vec3 d = normalize(vDir);
          float h = clamp(d.y, 0.0, 1.0);
          vec3 col = mix(uHorizon, uZenith, pow(h, 0.5));
          float s = max(dot(d, uSunDir), 0.0);
          col += uSunColor * (pow(s, 8.0) * 0.22 + pow(s, 90.0) * 0.45) * smoothstep(-0.02, 0.08, d.y);
          gl_FragColor = vec4(col, 1.0);
        }`,
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
    });
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), this.skyMat);
    this.sky.renderOrder = -10;
    this.sky.frustumCulled = false;
    scene.add(this.sky);

    // Mesh matahari: piringan yang selalu menghadap kamera, searah dengan DirectionalLight
    this.sunMesh = new THREE.Mesh(
      new THREE.CircleGeometry(1, 24),
      new THREE.MeshBasicMaterial({ color: 0xfff3d6, fog: false, depthWrite: false })
    );
    this.sunMesh.renderOrder = -9;
    this.sunMesh.frustumCulled = false;
    scene.add(this.sunMesh);

    // Cahaya: satu DirectionalLight matahari dan satu HemisphereLight
    this.hemi = new THREE.HemisphereLight(L.hemiSky, L.hemiGround, L.hemiIntensity);
    scene.add(this.hemi);
    this.sun = new THREE.DirectionalLight(L.sunColor, L.sunIntensity);
    this.sun.castShadow = Q.shadows;
    if (Q.shadows) {
      const sc = this.sun.shadow.camera, half = L.shadowFrustum / 2;
      sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
      sc.near = 1; sc.far = 900;
      this.sun.shadow.mapSize.set(Q.shadowMapSize, Q.shadowMapSize);
      this.sun.shadow.bias = L.shadowBias;
      this.sun.shadow.normalBias = L.shadowNormalBias;
    }
    scene.add(this.sun, this.sun.target);

    // Laut: satu bidang besar yang mengikuti pemain
    const size = (World.N + 2) * World.C;
    const waterGeo = new THREE.PlaneGeometry(size, size, 1, 1);
    waterGeo.rotateX(-Math.PI / 2);
    this.water = new THREE.Mesh(waterGeo, new THREE.MeshPhongMaterial({
      color: 0x2f79ad, specular: 0x6d6250, shininess: 45, flatShading: true,
    }));
    this.water.receiveShadow = Q.shadows;
    this.water.position.y = CONFIG.world.waterLevel;
    scene.add(this.water);
  },

  update() {
    const p = Player.pos;
    // Shadow camera berpusat pada pemain: frustum kecil sehingga tajam dan murah
    this.sun.position.copy(p).addScaledVector(this.sunDir, 300);
    this.sun.target.position.copy(p);
    this.sky.position.copy(camera.position);
    const d = camera.far * 0.7;
    this.sunMesh.position.copy(camera.position).addScaledVector(this.sunDir, d);
    this.sunMesh.scale.setScalar(d * 0.035);
    this.sunMesh.lookAt(camera.position);
    const C = World.C;
    this.water.position.x = Math.round(p.x / C) * C;
    this.water.position.z = Math.round(p.z / C) * C;
  },
};
