# CI RAPTOR13: pemeriksa gaya (tanpa em dash dan ampersand dalam teks), pemindai rahasia, validasi HTML
# dasar dan hash CSP, lalu uji Playwright ringkas di Chromium (render perangkat lunak SwiftShader).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Pemeriksa gaya
        run: node scripts/check-style.mjs
      - name: Pemindai rahasia (termasuk riwayat)
        run: node scripts/scan-secrets.mjs --history
      - name: Validasi HTML dasar dan hash CSP
        run: node scripts/check-html.mjs
      - name: Pasang dependensi uji
        run: npm ci
      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium
      - name: Uji Playwright ringkas
        run: npx playwright test tests/audit.spec.mjs tests/kontras.spec.mjs tests/equip.spec.mjs --project=chromium --grep-invert "frame rate|keseimbangan"
      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hasil-uji
          path: test-results/
          retention-days: 7
