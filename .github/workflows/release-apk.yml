# Rilis APK Android otomatis (C11). Saat tag v* didorong: salin game ke mobile/www, samakan versi, bangun APK rilis
# dan AAB bertanda tangan dari GitHub Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD),
# hitung SHA256SUMS, lalu lampirkan raptor13-vX.Y.Z.apk, raptor13.apk (nama tetap untuk tautan
# releases/latest/download/raptor13.apk), AAB, dan SHA256SUMS ke GitHub Release. Rahasia tidak pernah dicetak.
# Bila secret belum diatur, workflow membangun APK debug dan menamainya jelas sebagai tidak bertanda tangan rilis.
name: Rilis APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # hanya job ini yang boleh membuat atau memperbarui rilis
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Versi dari GAME_VERSION
        id: v
        run: |
          V=$(grep -o "const GAME_VERSION = '[0-9.]*'" index.html | grep -o "[0-9][0-9.]*")
          echo "versi=$V" >> "$GITHUB_OUTPUT"
          echo "Versi game: $V, tag: ${GITHUB_REF_NAME}"
      - name: Siapkan proyek Capacitor
        run: |
          cd mobile
          npm ci
          cd ..
          node scripts/sync-web.mjs
          node scripts/mobile-version.mjs
          cd mobile
          npx cap sync android
      - name: Pasang keystore dari secret
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +x
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rilis.jks"
          echo "Keystore dipasang di folder sementara runner"
      - name: Bangun APK rilis dan AAB bertanda tangan
        if: env.HAS_KEY == 'true'
        env:
          RAPTOR13_STORE_FILE: ${{ runner.temp }}/rilis.jks
          RAPTOR13_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAPTOR13_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAPTOR13_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/raptor13-v${{ steps.v.outputs.versi }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/raptor13.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/raptor13-v${{ steps.v.outputs.versi }}.aab"
      - name: Verifikasi tanda tangan
        if: env.HAS_KEY == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist/raptor13.apk | grep -i "SHA-256 digest"
          "$BT/aapt" dump badging dist/raptor13.apk | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission" || true
      - name: Bangun APK debug (secret belum diatur)
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::Secret KEYSTORE_BASE64 belum diatur. APK ini DEBUG dan TIDAK BERTANDA TANGAN RILIS. Lihat docs/apk/ci.md."
          cd mobile/android
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/raptor13-v${{ steps.v.outputs.versi }}-debug-tidak-bertanda-tangan-rilis.apk"
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Lampirkan ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
